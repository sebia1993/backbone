name: PR 빌드 검증

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: backbone-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

defaults:
  run:
    shell: pwsh
    working-directory: backbone_state_tracker

jobs:
  build:
    name: 테스트 및 Windows 통합 패키지 빌드
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: backbone_state_tracker
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backbone_state_tracker/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip bootstrap failed." }
          python -m pip install -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "dependency installation failed." }

      - name: Create package tag
        id: package_meta
        run: |
          $kstZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("Korea Standard Time")
          $kstNow = [System.TimeZoneInfo]::ConvertTime([System.DateTimeOffset]::UtcNow, $kstZone)
          "tag=$($kstNow.ToString("'v'yyyy.MM.dd-HHmmss"))" >> $env:GITHUB_OUTPUT

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run GUI source smoke check
        run: python app.py --smoke-check

      - name: Run webapp source smoke check
        run: python webapp_launcher.py --smoke

      - name: Build Windows integrated ZIP
        run: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\build_windows_exe.ps1 -SkipTests -ReleaseTag "${{ steps.package_meta.outputs.tag }}"

      - name: Locate built package
        id: package
        run: |
          $expectedName = "backbone_state_tracker_${{ steps.package_meta.outputs.tag }}_windows.zip"
          $zip = Get-ChildItem -LiteralPath dist -Filter $expectedName -File | Select-Object -First 1
          if (-not $zip) {
            throw "통합 Windows ZIP이 생성되지 않았습니다: $expectedName"
          }

          "zip_path=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "checksum=$((Get-FileHash -Algorithm SHA256 -LiteralPath $zip.FullName).Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Verify package explicitly
        run: python .\tools\verify_release_package.py "${{ steps.package.outputs.zip_path }}" --type windows --require-manifest --expected-sha256 "${{ steps.package.outputs.checksum }}"
