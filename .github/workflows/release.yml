name: Windows 통합 패키지 릴리스

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh
    working-directory: backbone_state_tracker

jobs:
  release:
    name: 빌드, 검증, 릴리스 게시
    runs-on: windows-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: backbone_state_tracker

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backbone_state_tracker/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Create KST release metadata
        id: release_meta
        run: |
          $kstZone = [System.TimeZoneInfo]::FindSystemTimeZoneById("Korea Standard Time")
          $kstNow = [System.TimeZoneInfo]::ConvertTime([System.DateTimeOffset]::UtcNow, $kstZone)
          $baseTag = $kstNow.ToString("'v'yyyy.MM.dd-HHmmss")
          $tag = $baseTag
          $suffix = 1

          while ($true) {
            $existingTag = git ls-remote --tags origin "refs/tags/$tag"
            if ([string]::IsNullOrWhiteSpace($existingTag)) {
              break
            }
            $tag = "$baseTag-$suffix"
            $suffix += 1
          }

          "tag=$tag" >> $env:GITHUB_OUTPUT
          "title=backbone_state_tracker $tag" >> $env:GITHUB_OUTPUT

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Run GUI source smoke check
        run: python app.py --smoke-check

      - name: Run webapp source smoke check
        run: python webapp_launcher.py --smoke

      - name: Build Windows integrated ZIP
        run: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\build_windows_exe.ps1 -SkipTests -ReleaseTag "${{ steps.release_meta.outputs.tag }}"

      - name: Collect release artifact
        id: artifact
        run: |
          $expectedName = "backbone_state_tracker_${{ steps.release_meta.outputs.tag }}_windows.zip"
          $zip = Get-ChildItem -LiteralPath dist -Filter $expectedName -File | Select-Object -First 1
          if (-not $zip) {
            throw "통합 Windows ZIP이 생성되지 않았습니다: $expectedName"
          }

          $checksum = (Get-FileHash -Algorithm SHA256 -LiteralPath $zip.FullName).Hash.ToLowerInvariant()
          "artifact_path=$($zip.FullName)" >> $env:GITHUB_OUTPUT
          "artifact_name=$($zip.Name)" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Verify package explicitly
        run: python .\tools\verify_release_package.py "${{ steps.artifact.outputs.artifact_path }}" --type windows --require-manifest --expected-sha256 "${{ steps.artifact.outputs.checksum }}"

      - name: Write release notes
        id: notes
        run: |
          $previousTag = git describe --tags --abbrev=0 --match "v*" HEAD^ 2>$null
          if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace($previousTag)) {
            $commitRange = "$previousTag..HEAD"
            $rangeLabel = "$previousTag 이후"
          } else {
            $commitRange = "HEAD"
            $rangeLabel = "확인 가능한 전체 커밋"
          }

          $commits = git log --pretty=format:"- %h %s" $commitRange
          if ([string]::IsNullOrWhiteSpace($commits)) {
            $commits = "- 커밋 항목을 찾지 못했습니다."
          }

          $changeSummaries = git log --pretty=format:"- %s" $commitRange
          if ([string]::IsNullOrWhiteSpace($changeSummaries)) {
            $changeSummaries = "- 변경 항목을 찾지 못했습니다."
          }

          $notesPath = Join-Path $PWD "release_notes.md"
          $notesLines = @(
            "${{ steps.release_meta.outputs.tag }} 릴리스입니다.",
            "",
            "변경내용:",
            $changeSummaries,
            "",
            "검증:",
            '- `python -m unittest discover -s tests` 통과',
            '- `python app.py --smoke-check` 통과',
            '- `python webapp_launcher.py --smoke` 통과',
            "- Windows 통합 ZIP 빌드 통과",
            "- Windows 통합 ZIP 구조 verifier 통과",
            "- GUI 실행 파일 smoke 검증 통과",
            "- 웹앱 실행 파일 smoke 검증 통과",
            "",
            "빌드:",
            '- `pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\tools\build_windows_exe.ps1 -SkipTests -ReleaseTag ${{ steps.release_meta.outputs.tag }}` 통과',
            "",
            "첨부파일:",
            "- 통합 Windows ZIP: ``${{ steps.artifact.outputs.artifact_name }}``",
            "",
            "실행 방법:",
            "- GUI: ZIP 압축 해제 후 ``gui\BackboneStateTracker.exe``를 더블클릭합니다.",
            "- 웹앱: ZIP 압축 해제 후 ``web\start_webapp.cmd``를 더블클릭합니다. 기본 주소는 ``http://127.0.0.1:8765/``입니다.",
            "- 웹앱 포트 변경: ``web\start_webapp.cmd --port 8777``처럼 실행합니다.",
            "",
            "중요 안내:",
            "- GitHub가 자동으로 표시하는 ``Source code (zip)`` / ``Source code (tar.gz)``는 소스 아카이브이며 일반 사용자 실행 파일이 아닙니다.",
            "- 사용자 다운로드용 직접 업로드 asset은 위 통합 Windows ZIP 1개입니다.",
            "",
            "배포 메타데이터:",
            "- 브랜치명: ``${{ github.ref_name }}``",
            "- 기준 커밋 SHA: ``${{ github.sha }}``",
            "- 통합 ZIP 파일명: ``${{ steps.artifact.outputs.artifact_name }}``",
            "- SHA256 checksum: ``${{ steps.artifact.outputs.checksum }}``",
            "- 변경 커밋 목록 ($rangeLabel):",
            $commits
          )
          $notes = $notesLines -join [Environment]::NewLine
          Set-Content -LiteralPath $notesPath -Value $notes -Encoding UTF8
          "notes_path=$notesPath" >> $env:GITHUB_OUTPUT

      - name: Create and push Git tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.release_meta.outputs.tag }}" "${{ github.sha }}" -m "backbone_state_tracker ${{ steps.release_meta.outputs.tag }}"
          git push origin "refs/tags/${{ steps.release_meta.outputs.tag }}"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.release_meta.outputs.tag }}" `
            "${{ steps.artifact.outputs.artifact_path }}#${{ steps.artifact.outputs.artifact_name }}" `
            --title "${{ steps.release_meta.outputs.title }}" `
            --notes-file "${{ steps.notes.outputs.notes_path }}" `
            --latest `
            --verify-tag
